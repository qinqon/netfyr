[workspace]
resolver = "2"
members = [
    "crates/netfyr-state",
    "crates/netfyr-policy",
    "crates/netfyr-backend",
    "crates/netfyr-reconcile",
    "crates/netfyr-plugin-runtime",
    "crates/netfyr-plugin-precompile",
    "crates/netfyr-ovs",
    "tests/integration/probe",
    "tests/integration/plugins/guest",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"
version = "0.1.0"
license = "MIT"
repository = "https://github.com/netfyr/netfyr"

[workspace.dependencies]
# wasmtime: validates and executes WebAssembly components. Pin the precompiler
# and host together: serialized native artifacts are runtime-version specific.
wasmtime = { version = "=49.0.5", default-features = false, features = ["std", "runtime", "component-model"] }
