[package]
name = "netfyr-plugin-runtime"
description = "Experimental capability-limited WebAssembly observation host"
publish = false
edition.workspace = true
version.workspace = true
license.workspace = true
# Wasmtime 49 requires Rust 1.96; the existing core crates retain their MSRV.
rust-version = "1.96"
repository.workspace = true

[features]
default = ["compile"]
compile = ["wasmtime/cranelift"]
pulley = ["wasmtime/pulley"]

[dependencies]
netfyr-state = { path = "../netfyr-state" }
# wasmtime: component validation, WIT bindings, execution limits and isolation.
wasmtime.workspace = true
# serde_json: decode the language-independent plugin result and schema format.
serde_json = "1"
# tokio: deadline-bounded Unix socket connect/read/write, including partial I/O.
tokio = { version = "1", features = ["rt", "net", "time", "io-util"] }

[dev-dependencies]
netfyr-backend = { path = "../netfyr-backend" }
