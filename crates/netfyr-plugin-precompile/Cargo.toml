[package]
name = "netfyr-plugin-precompile"
description = "Build/install-time compiler for the experimental plugin host"
publish = false
edition.workspace = true
version.workspace = true
license.workspace = true
# Match the experimental runtime's Wasmtime requirement.
rust-version = "1.96"
repository.workspace = true

[dependencies]
netfyr-plugin-runtime = { path = "../netfyr-plugin-runtime", default-features = false, features = ["compile"] }
# wasmtime: precompile a portable component with the host's exact configuration.
wasmtime = { workspace = true, features = ["cranelift"] }
